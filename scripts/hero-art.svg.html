<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<!--
  Westminster in heavy mist — the hero plate.

  Monochromatic deep cyan to faded pale teal. The top half is left as clean
  fog so headline text sits on it safely; every structure starts below the
  halfway line and loses contrast with distance, so the skyline dissolves
  rather than ends. Grain and aquatint are real filter passes, not an overlay
  texture, so they survive scaling.
-->
<svg width="2400" height="1350" viewBox="0 0 2400 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky: palest at the top where the headline sits, deepening to the horizon. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#dfeeed"/>
      <stop offset="34%"  stop-color="#cfe4e4"/>
      <stop offset="58%"  stop-color="#b4d2d5"/>
      <stop offset="78%"  stop-color="#9ac0c6"/>
      <stop offset="100%" stop-color="#8fb8bf"/>
    </linearGradient>

    <!-- Light pooling behind the tower, the way sun burns through fog. -->
    <radialGradient id="glow" cx="63%" cy="62%" r="42%">
      <stop offset="0%"   stop-color="#f2fbf8" stop-opacity="0.85"/>
      <stop offset="45%"  stop-color="#e2f1ef" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#d8ecea" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8db6bd"/>
      <stop offset="40%"  stop-color="#7ba7b0"/>
      <stop offset="100%" stop-color="#5d8d98"/>
    </linearGradient>

    <!-- Fog banks: each layer sits in front of a tier of buildings. -->
    <linearGradient id="fogBank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cfe4e4" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#cbe2e2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c6dfe0" stop-opacity="0.78"/>
    </linearGradient>

    <linearGradient id="fogLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bedcdd" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#b6d6d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#aacdd2" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Vertical wash that fades every silhouette into the bank behind it. -->
    <linearGradient id="dissolve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dissolveMask">
      <rect x="0" y="600" width="2400" height="560" fill="url(#dissolve)"/>
    </mask>

    <!-- Heavy analog grain. fractalNoise desaturated, then laid over at low alpha. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="contrast">
        <feFuncA type="linear" slope="2.1" intercept="-0.52"/>
      </feComponentTransfer>
    </filter>

    <!-- Coarser, blotchier pass: the aquatint tooth. -->
    <filter id="aquatint" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="5" seed="23" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="linear" slope="1.5" intercept="-0.38"/>
      </feComponentTransfer>
    </filter>

    <filter id="softFar"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="softMid"><feGaussianBlur stdDeviation="3.6"/></filter>
    <filter id="softNear"><feGaussianBlur stdDeviation="1.7"/></filter>
    <filter id="haze"><feGaussianBlur stdDeviation="26"/></filter>

    <!-- One Gothic bay: buttress, window, pinnacle. Tiled to build the palace. -->
    <g id="bay">
      <rect x="0" y="0" width="34" height="200" />
      <rect x="10" y="-16" width="14" height="20" />
      <path d="M9 -16 L17 -42 L25 -16 Z" />
    </g>
  </defs>

  <!-- ============ sky ============ -->
  <rect width="2400" height="1350" fill="url(#sky)"/>
  <rect width="2400" height="1350" fill="url(#glow)"/>

  <!-- Drifting fog striations in the upper air, very low contrast. -->
  <g filter="url(#haze)" opacity="0.5">
    <ellipse cx="640"  cy="486" rx="760" ry="48" fill="#eef7f4" opacity="0.5"/>
    <ellipse cx="1780" cy="560" rx="700" ry="40" fill="#eaf5f2" opacity="0.42"/>
    <ellipse cx="1180" cy="640" rx="980" ry="54" fill="#e4f1ef" opacity="0.5"/>
  </g>

  <!-- ============ far tier: the far bank, barely there ============ -->
  <g fill="#8fb4bb" opacity="0.30" filter="url(#softFar)">
    <rect x="80"   y="846" width="150" height="128"/>
    <rect x="250"  y="862" width="104" height="112"/>
    <rect x="2070" y="836" width="138" height="138"/>
    <rect x="2230" y="858" width="128" height="116"/>
    <path d="M2122 836 l22 -54 l22 54 Z"/>
  </g>

  <!-- ============ mid tier: Westminster ============ -->
  <!--
    Victoria Tower at the left, the long palace range, then the Elizabeth
    Tower right of centre. Kept wholly below the halfway line (675) so the
    top half stays clean for text.
  -->
  <g fill="#56858f" opacity="0.82" filter="url(#softMid)">

    <!-- Victoria Tower: square, bulky, the heavier bookend. -->
    <g>
      <rect x="606" y="738" width="150" height="268"/>
      <rect x="596" y="722" width="170" height="20"/>
      <!-- corner turrets -->
      <rect x="600" y="688" width="20" height="40"/>
      <rect x="742" y="688" width="20" height="40"/>
      <path d="M600 688 l10 -26 l10 26 Z"/>
      <path d="M742 688 l10 -26 l10 26 Z"/>
      <!-- crown and flagstaff -->
      <path d="M636 722 L681 672 L726 722 Z"/>
      <rect x="679" y="612" width="5" height="62"/>
      <!-- window bays -->
      <g fill="#4e7f8a" opacity="0.5">
        <rect x="628" y="772" width="18" height="48"/>
        <rect x="662" y="772" width="18" height="48"/>
        <rect x="696" y="772" width="18" height="48"/>
        <rect x="628" y="852" width="18" height="48"/>
        <rect x="662" y="852" width="18" height="48"/>
        <rect x="696" y="852" width="18" height="48"/>
      </g>
    </g>

    <!-- The long palace range between the two towers. -->
    <rect x="756" y="878" width="676" height="128"/>
    <rect x="748" y="866" width="692" height="16"/>
    <g opacity="0.95">
      <use href="#bay" x="772"  y="872" transform="scale(1)"/>
      <use href="#bay" x="846"  y="872"/>
      <use href="#bay" x="920"  y="872"/>
      <use href="#bay" x="994"  y="872"/>
      <use href="#bay" x="1068" y="872"/>
      <use href="#bay" x="1142" y="872"/>
      <use href="#bay" x="1216" y="872"/>
      <use href="#bay" x="1290" y="872"/>
      <use href="#bay" x="1364" y="872"/>
    </g>
    <!-- Central spire over the range. -->
    <g>
      <rect x="1074" y="800" width="54" height="70"/>
      <path d="M1068 800 L1101 724 L1134 800 Z"/>
      <rect x="1099" y="690" width="4" height="38"/>
    </g>

    <!-- Elizabeth Tower (Big Ben): slender, ~4:1, the anchor of the skyline. -->
    <g>
      <!-- shaft -->
      <rect x="1506" y="792" width="100" height="250"/>
      <!-- string courses break up the shaft -->
      <g fill="#4e7f8a" opacity="0.3">
        <rect x="1506" y="880" width="100" height="5"/>
        <rect x="1506" y="958" width="100" height="5"/>
      </g>
      <!-- clock stage -->
      <rect x="1494" y="742" width="124" height="52"/>
      <!-- clock face -->
      <circle cx="1556" cy="768" r="23" fill="#d8eae7" opacity="0.8"/>
      <circle cx="1556" cy="768" r="23" fill="none" stroke="#3f6f7b" stroke-width="4" opacity="0.55"/>
      <!-- belfry -->
      <rect x="1500" y="706" width="112" height="38"/>
      <g fill="#4e7f8a" opacity="0.5">
        <rect x="1512" y="712" width="11" height="28"/>
        <rect x="1534" y="712" width="11" height="28"/>
        <rect x="1556" y="712" width="11" height="28"/>
        <rect x="1578" y="712" width="11" height="28"/>
      </g>
      <!-- corner pinnacles -->
      <path d="M1496 706 l8 -34 l8 34 Z"/>
      <path d="M1600 706 l8 -34 l8 34 Z"/>
      <!-- spire -->
      <path d="M1510 706 L1556 596 L1602 706 Z"/>
      <rect x="1554" y="560" width="4" height="40"/>
      <circle cx="1556" cy="558" r="5"/>
      <!-- shaft window bays -->
      <g fill="#4e7f8a" opacity="0.4">
        <rect x="1524" y="812" width="14" height="40"/>
        <rect x="1550" y="812" width="14" height="40"/>
        <rect x="1576" y="812" width="14" height="40"/>
        <rect x="1524" y="898" width="14" height="40"/>
        <rect x="1550" y="898" width="14" height="40"/>
        <rect x="1576" y="898" width="14" height="40"/>
      </g>
    </g>

    <!-- Lower range continuing right, dissolving out. -->
    <rect x="1614" y="900" width="300" height="106"/>
    <g opacity="0.8">
      <use href="#bay" x="1634" y="896"/>
      <use href="#bay" x="1708" y="896"/>
      <use href="#bay" x="1782" y="896"/>
      <use href="#bay" x="1856" y="896"/>
    </g>
  </g>

  <!-- Wash that dissolves the skyline upward into the fog. -->
  <rect x="0" y="600" width="2400" height="560" fill="#cfe4e4" mask="url(#dissolveMask)" opacity="0.62"/>

  <!-- Fog bank rolling in front of the palace. -->
  <rect x="0" y="806" width="2400" height="300" fill="url(#fogBank)"/>
  <g filter="url(#haze)" opacity="0.72">
    <ellipse cx="500"  cy="952" rx="640" ry="58" fill="#cde3e3"/>
    <ellipse cx="1500" cy="938" rx="720" ry="52" fill="#cde3e3"/>
    <ellipse cx="2160" cy="960" rx="520" ry="56" fill="#cde3e3"/>
  </g>

  <!-- ============ water ============ -->
  <rect x="0" y="1030" width="2400" height="130" fill="url(#water)" opacity="0.5" filter="url(#softMid)"/>
  <!-- Reflections: smeared verticals, no detail. -->
  <g opacity="0.2" filter="url(#softFar)">
    <rect x="1498" y="1012" width="116" height="118" fill="#3f6f7b"/>
    <rect x="606"  y="1012" width="150" height="104" fill="#3f6f7b"/>
    <rect x="1074" y="1012" width="54"  height="92"  fill="#3f6f7b"/>
  </g>
  <g opacity="0.3">
    <rect x="0" y="1040" width="2400" height="2" fill="#d2e6e4"/>
    <rect x="0" y="1068" width="2400" height="2" fill="#cadfdf"/>
    <rect x="0" y="1096" width="2400" height="3" fill="#c2d9da"/>
  </g>

  <!-- Low fog sitting on the water. -->
  <rect x="0" y="1000" width="2400" height="180" fill="url(#fogLow)"/>

  <!-- ============ foreground: the bridge ============ -->
  <!--
    Nearest element, so it carries the deepest value and the least blur —
    this is what sells the depth against the dissolved skyline.
  -->
  <mask id="archMask">
    <rect x="0" y="1196" width="2400" height="154" fill="#fff"/>
    <!-- Shallow segmental openings, mostly below the frame edge. -->
    <path d="M96   1350 V1320 A144 62 0 0 1 384  1320 V1350 Z" fill="#000"/>
    <path d="M576  1350 V1320 A144 62 0 0 1 864  1320 V1350 Z" fill="#000"/>
    <path d="M1056 1350 V1320 A144 62 0 0 1 1344 1320 V1350 Z" fill="#000"/>
    <path d="M1536 1350 V1320 A144 62 0 0 1 1824 1320 V1350 Z" fill="#000"/>
    <path d="M2016 1350 V1320 A144 62 0 0 1 2304 1320 V1350 Z" fill="#000"/>
  </mask>

  <!--
    The nearest mass, so it holds the deepest value in the frame — but still
    sitting in the same air as everything else, not a hard graphic band.
    What shows through the arches is dim water, close in value to the
    spandrel, so the openings read as recesses rather than cut-outs.
  -->
  <rect x="0" y="1196" width="2400" height="154" fill="#3c6c78" opacity="0.88"/>

  <g filter="url(#softNear)">
    <!-- parapet and deck -->
    <rect x="0" y="1160" width="2400" height="16" fill="#1b4a56" opacity="0.8"/>
    <rect x="0" y="1176" width="2400" height="22" fill="#17434f" opacity="0.86"/>
    <!-- spandrel mass with the arches cut out -->
    <rect x="0" y="1196" width="2400" height="154" fill="#143c48" opacity="0.9" mask="url(#archMask)"/>
  </g>

  <!-- Fog drawn back across the bridge so it is not a hard graphic edge. -->
  <g filter="url(#haze)" opacity="0.62">
    <ellipse cx="620"  cy="1216" rx="820" ry="54" fill="#bddcdd"/>
    <ellipse cx="1800" cy="1228" rx="840" ry="48" fill="#bddcdd"/>
  </g>

  <!-- Lamp standards along the parapet. -->
  <g fill="#17424e" opacity="0.82">
    <g>
      <rect x="252" y="1084" width="7" height="76"/>
      <circle cx="255" cy="1076" r="11" opacity="0.55"/>
      <circle cx="255" cy="1076" r="20" fill="#e8f5f1" opacity="0.2"/>
    </g>
    <g>
      <rect x="692" y="1084" width="7" height="76"/>
      <circle cx="695" cy="1076" r="11" opacity="0.55"/>
      <circle cx="695" cy="1076" r="20" fill="#e8f5f1" opacity="0.2"/>
    </g>
    <g>
      <rect x="1132" y="1084" width="7" height="76"/>
      <circle cx="1135" cy="1076" r="11" opacity="0.55"/>
      <circle cx="1135" cy="1076" r="20" fill="#e8f5f1" opacity="0.2"/>
    </g>
    <g>
      <rect x="1572" y="1084" width="7" height="76"/>
      <circle cx="1575" cy="1076" r="11" opacity="0.55"/>
      <circle cx="1575" cy="1076" r="20" fill="#e8f5f1" opacity="0.2"/>
    </g>
    <g>
      <rect x="2012" y="1084" width="7" height="76"/>
      <circle cx="2015" cy="1076" r="11" opacity="0.55"/>
      <circle cx="2015" cy="1076" r="20" fill="#e8f5f1" opacity="0.2"/>
    </g>
  </g>

  <!-- A last breath of fog across the bridge, so nothing reads as hard-edged. -->
  <g filter="url(#haze)" opacity="0.4">
    <ellipse cx="900"  cy="1150" rx="820" ry="44" fill="#bedcdd"/>
    <ellipse cx="1900" cy="1172" rx="700" ry="40" fill="#bedcdd"/>
  </g>

  <!-- ============ grading and texture ============ -->
  <!-- Lift the blacks so shadows read faded rather than crushed. -->
  <rect width="2400" height="1350" fill="#2f6f7d" opacity="0.07"/>
  <!-- Wash the highlights. -->
  <rect width="2400" height="1350" fill="#e9f4f1" opacity="0.1"/>

  <!-- Aquatint tooth. -->
  <rect width="2400" height="1350" filter="url(#aquatint)" opacity="0.3" style="mix-blend-mode:multiply"/>
  <!-- Film grain. -->
  <rect width="2400" height="1350" filter="url(#grain)" opacity="0.52" style="mix-blend-mode:overlay"/>
  <rect width="2400" height="1350" filter="url(#grain)" opacity="0.2"/>
  <rect width="2400" height="1350" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:multiply"/>

  <!-- Vignette, heavier at the base, keeping the top half open. -->
  <radialGradient id="vig" cx="50%" cy="42%" r="78%">
    <stop offset="52%" stop-color="#0f3b46" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0f3b46" stop-opacity="0.3"/>
  </radialGradient>
  <rect width="2400" height="1350" fill="url(#vig)"/>
</svg>
</body>
</html>
